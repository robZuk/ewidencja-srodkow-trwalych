# Production stack for a Mikr.us VPS. Run with the secrets file as BOTH the
# interpolation source and the container env:
#
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# The app is the only service with a published port (mapped to a Mikr.us TCP
# port via WEB_PORT). The database lives on an internal-only network.
name: asset-inventory

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    # When deploying pre-built images from GHCR (CI/CD), set APP_IMAGE and use
    # `docker compose pull` instead of `--build`.
    image: ${APP_IMAGE:-asset-inventory:latest}
    env_file: .env.prod
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edge
      - internal
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:

networks:
  edge:
  internal:
    internal: true
