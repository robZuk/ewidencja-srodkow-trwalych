services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    # Run as the host user so files created in the mounted volume stay editable.
    # Override with `UID=$(id -u) GID=$(id -g) docker compose up` if not 1000.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8000:8000"   # Laravel dev server
      - "5173:5173"   # Vite dev server (HMR)
    volumes:
      - .:/var/www/html
    environment:
      HOME: /tmp
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: asset_inventory
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d asset_inventory"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
