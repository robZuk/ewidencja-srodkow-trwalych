# CI — quality gate on pushes to main/master and on Pull Requests.
# The actual jobs live in the reusable tests.yml (shared with deploy.yml, so the
# definition stays in one place); here we just call it.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    uses: ./.github/workflows/tests.yml
