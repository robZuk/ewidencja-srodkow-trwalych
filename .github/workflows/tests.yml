# Reusable workflow — quality gate: lint (Pint), static analysis (Larastan),
# tests (Pest on PostgreSQL) and the front-end asset build.
# Defined once here and called by both ci.yml (push/PR) and deploy.yml (as the
# gate before deploying) via `uses: ./.github/workflows/tests.yml`.
name: Tests

on:
  workflow_call:

jobs:
  quality:
    name: Lint, static analysis, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: asset_inventory
          POSTGRES_USER: app
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d asset_inventory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_pgsql, gd, zip, intl, bcmath, exif, mbstring
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style (Pint)
        run: ./vendor/bin/pint --test

      - name: Static analysis (Larastan)
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Run tests (Pest)
        # Run the suite on PostgreSQL (the deployment engine). These real env vars
        # override phpunit.xml's non-forced sqlite defaults.
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: asset_inventory
          DB_USERNAME: app
          DB_PASSWORD: secret
        run: ./vendor/bin/pest

  assets:
    name: Build frontend assets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, zip, intl, bcmath, exif, mbstring
          coverage: none

      # resources/css/app.css imports vendor/livewire/flux/dist/flux.css, so the
      # Vite build needs Composer packages present.
      - name: Install PHP dependencies
        run: composer install --no-dev --no-scripts --no-interaction --no-progress --prefer-dist

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build
