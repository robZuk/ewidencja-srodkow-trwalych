# Optional CD pipeline (mirror of the planista7 setup). Inactive until:
#   1. the repo is pushed to GitHub, and
#   2. the MIKRUS_* secrets are set (Settings → Secrets and variables → Actions).
# Until then, deploy manually per docs/deploy-mikrus.md.
#
# Flow: push to main → build & push image to GHCR → SSH to Mikr.us → pull & up.
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build-push-deploy:
    name: Build image, push to GHCR, deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Job-level env so it's available in the deploy step's `if` (step-level env
    # is not visible to that same step's condition).
    env:
      MIKRUS_HOST: ${{ secrets.MIKRUS_HOST }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: img
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.prod
          push: true
          tags: |
            ${{ steps.img.outputs.image }}:latest
            ${{ steps.img.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploy only when the SSH secret is configured (skipped otherwise so the
      # build still validates on every push).
      - name: Deploy to Mikr.us (SSH)
        if: ${{ env.MIKRUS_HOST != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.MIKRUS_HOST }}
          port: ${{ secrets.MIKRUS_PORT }}
          username: ${{ secrets.MIKRUS_USER }}
          key: ${{ secrets.MIKRUS_SSH_KEY }}
          script: |
            cd /srv/ewidencja-srodkow-trwalych
            git pull --ff-only
            export APP_IMAGE=${{ steps.img.outputs.image }}:latest
            docker compose --env-file .env.prod -f docker-compose.prod.yml pull
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
            docker image prune -f
